<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed Cleanser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <img class="brand-mark" src="icon.png" alt="" />
        <div>
          <p class="eyebrow">Feed Cleanser</p>
          <h1>Your feed, your choice.</h1>
        </div>
      </header>

      <button id="extension-enabled" class="filtering-button" type="button" data-enabled="true">
        <span class="filtering-icon" aria-hidden="true"></span>
        <span class="filtering-label">Pause on this site</span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section class="muted-section" aria-labelledby="muted-heading">
        <div class="muted-heading-row">
          <div>
            <h2 id="muted-heading">Muted profiles</h2>
          </div>
          <button id="start-selection" class="find-profile-button" type="button">
            <span class="button-plus" aria-hidden="true">+</span>
            <span>Mute a user from your feed</span>
          </button>
        </div>
        <ul id="muted-list" class="muted-list"></ul>
        <p id="muted-empty" class="empty-state">No profiles muted on this site.</p>
      </section>

      <section class="keyword-section" aria-labelledby="keyword-heading">
        <div class="muted-heading-row">
          <div>
            <h2 id="keyword-heading">Blocked keywords</h2>
          </div>
        </div>
        <form id="keyword-form" class="keyword-form">
          <input
            id="keyword-input"
            type="text"
            maxlength="100"
            autocomplete="off"
            placeholder="e.g. B2B SaaS"
            aria-label="Keyword to block"
          />
          <button type="submit">
            <span class="button-plus" aria-hidden="true">+</span>
            <span>Add</span>
          </button>
        </form>
        <ul id="keyword-list" class="keyword-list"></ul>
        <p id="keyword-empty" class="empty-state">No keywords blocked on this site.</p>
      </section>

      <section class="manage-section">
        <div class="muted-heading-row">
          <div>
            <h2 id="muted-heading">Management and settings</h2>
          </div>
        </div>
        <button id="open-settings" class="settings-link" type="button">
          <span>Manage choices on all sites</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>
    </main>

    <dialog id="remove-confirmation" class="remove-confirmation" aria-labelledby="confirmation-question">
      <form method="dialog" class="confirmation-card">
        <p id="confirmation-question" class="confirmation-question"></p>
        <div class="confirmation-actions">
          <button class="confirmation-cancel" type="submit" value="cancel">Cancel</button>
          <button id="confirmation-confirm" class="confirmation-confirm" type="submit" value="confirm">
            Confirm
          </button>
        </div>
      </form>
    </dialog>
    <script src="popup.js"></script>
  </body>
</html>
