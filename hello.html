<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mute Anyone</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <img class="brand-mark" src="icon.png" alt="" />
        <div>
          <p class="eyebrow">Mute Anyone</p>
          <h1>Your feed, your choice.</h1>
        </div>
      </header>

      <button id="extension-enabled" class="filtering-button" type="button" data-enabled="true">
        <span class="filtering-icon" aria-hidden="true"></span>
        <span class="filtering-label">Pause on this site</span>
      </button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section class="muted-section" aria-labelledby="muted-heading">
        <div class="muted-heading-row">
          <div>
            <h2 id="muted-heading">Muted profiles</h2>
            <p id="muted-summary" class="muted-summary">0 profiles muted on this site</p>
          </div>
          <button id="start-selection" class="find-profile-button" type="button">Find a profile to mute</button>
        </div>
        <ul id="muted-list" class="muted-list"></ul>
        <p id="muted-empty" class="empty-state">No profiles muted on this site.</p>
        <button id="open-settings" class="settings-link" type="button">
          <span>Manage all sites</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>

      <section class="keyword-section" aria-labelledby="keyword-heading">
        <div class="muted-heading-row">
          <div>
            <h2 id="keyword-heading">Blocked keywords</h2>
          </div>
        </div>
        <form id="keyword-form" class="keyword-form">
          <input
            id="keyword-input"
            type="text"
            maxlength="100"
            autocomplete="off"
            placeholder="e.g. B2B SaaS"
            aria-label="Keyword to block"
          />
          <button type="submit">Add</button>
        </form>
        <ul id="keyword-list" class="keyword-list"></ul>
        <p id="keyword-empty" class="empty-state">No keywords blocked on this site.</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
